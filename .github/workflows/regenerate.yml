name: Regenerate processed spectra

on:
  push:
    branches: ["main"]
    paths:
      - "raw/**"
      - "scripts/process_spectra.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild all derived data and plots
        run: python scripts/process_spectra.py
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed plots metadata/samples.csv metadata/normalisation_anchors.csv metadata/processing_manifest.json dashboard/assets
          if git diff --cached --quiet; then
            echo "No derived changes to commit."
          else
            git commit -m "Regenerate processed TOSCA spectra"
            git push
          fi
